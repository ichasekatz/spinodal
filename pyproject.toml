[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[project]
name = "spinodal"
version = "0.1.0"
description = "CALPHAD spinodal decomposition analysis via Jansson chemical Hessian"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [{ name = "Chase Katz", email = "ichasekatz@tamu.edu" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]
dependencies = [
    "pycalphad>=0.10",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[dependency-groups]
dev = ["pytest", "ruff", "ty"]
docs = ["mkdocs-material", "mkdocstrings[python]"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 130
force-exclude = true

[tool.ruff.lint]
select = ["A", "B", "C4", "D", "E", "ERA", "F", "FA", "I", "ICN", "N", "PL", "PTH", "Q", "SIM", "TC", "UP", "W"]
ignore = [
    "E501",
    "PLR0913",   # too-many-arguments (keyword-only signature pattern)
    "PLR0917",   # too-many-positional-arguments (physics APIs have many params)
    "PLR2004",
    "N802",      # function-name-uppercase (e.g. test_something_H)
    "N803",      # argument-name-uppercase (T, P, H, E, V_m — physics convention)
    "N806",      # variable-in-function-uppercase (same convention)
    "D102",      # missing-docstring-in-public-method (test methods)
    "B905",      # zip-without-explicit-strict (style preference)
]
pydocstyle.convention = "google"

[tool.ruff.format]
quote-style = "double"

[tool.ty.src]
include = ["src", "tests"]
